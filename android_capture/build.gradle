plugins {
    id 'com.android.application' version '8.9.3'
    id 'com.chaquo.python' version '17.0.0'
}
android {
    namespace 'org.datamatrix.rawcapture'
    compileSdk 36
    defaultConfig {
        applicationId 'org.datamatrix.rawcapture'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.2-live-boundary'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    if (file('.local/debug.keystore').exists()) { signingConfigs {
        localDebug { storeFile file('.local/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes { debug { signingConfig signingConfigs.localDebug } } }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; python.srcDirs = ['python'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
chaquopy {
    defaultConfig {
        version '3.10'
        buildPython(System.getenv('PYTHON310') ?: (file('../tools/mobile-build/python310-full/python.exe').exists() ? '../tools/mobile-build/python310-full/python.exe' : 'python3.10'))
        pip { install 'numpy==1.26.2'; install 'opencv-python==4.5.1.48' }
    }
}

dependencies { implementation "com.google.zxing:core:3.5.3" }
